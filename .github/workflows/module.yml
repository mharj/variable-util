name: Module Common CI
on:
  workflow_call:
    inputs:
      package-path:
        required: true
        type: string

env:
  # Setting an environment variable with the value of a configuration variable
  PUBLISH_BRANCH: "refs/heads/main"
  PACKAGE_NAME: "unknown"
  PACKAGE_VERSION: "unknown"
  NPM_VERSION: "unknown"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: luolapeikko/github-actions/read-package-info@v0
        with:
          working-directory: ${{ inputs.package-path }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v4
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install workspace deps
        run: pnpm install

      - name: Playwrite install
        run: pnpm exec playwright install

      - name: Build
        run: pnpm run build

      - name: Validate
        run: pnpm run validate

      - name: Test
        run: pnpm run test

      - name: Lint
        run: pnpm run lint

      - name: Publish ${{env.PACKAGE_NAME}} ${{env.PACKAGE_VERSION}}
        working-directory: ${{ inputs.package-path }}
        if: |
          github.ref == env.PUBLISH_BRANCH &&
          env.PACKAGE_VERSION != env.NPM_VERSION
        run: npm publish --access public
