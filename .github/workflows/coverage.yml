name: coverage CI
on:
  push:
    branches: [main]
    paths:
      - "packages/**/*.ts"
      - "vitest.config.mts"
      - ".github/workflows/coverage.yml"

permissions:
  contents: read
  id-token: write # IMPORTANT

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
      - uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install

      - name: Playwrite install
        run: pnpm exec playwright install

      - name: Run tests
        run: pnpm run test

      - name: Run and publish code coverage
        uses: qltysh/qlty-action/coverage@ebcd284bf32e36a030afe15f1e136c7be08b9506 # v2.5.0
        with:
          oidc: true
          files: coverage/lcov.info
