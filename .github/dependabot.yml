version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions-batch:
        patterns:
          - "*"
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      devcontainers-batch:
        patterns:
          - "*"
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/packages/variable-util"
      - "/packages/variable-util-azurekv"
      - "/packages/variable-util-node"
      - "/packages/variable-util-tachyon"
      - "/packages/variable-util-vite"
    schedule:
      interval: "monthly"
    groups:
      dev-dependencies:
        dependency-type: "development"
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]